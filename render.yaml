# Render Blueprint for TradeDesk. One web service runs the whole app: FastAPI
# serves both the pages and the API. The database is Neon and Redis is
# Upstash. Secrets are never stored here: "sync: false" means Render asks for
# the value in its dashboard, and SECRET_KEY is generated by Render.
services:
  - type: web
    name: tradedesk-api
    runtime: python
    plan: free
    region: ohio
    branch: main
    # Deploy only after the GitHub checks (tests and security scan) pass.
    autoDeployTrigger: checksPass
    # Install the exact hash-pinned packages that passed pip-audit.
    buildCommand: pip install --require-hashes --no-deps -r requirements-lock.txt
    # Apply database migrations, then start the API.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSLMODE
        value: verify-full
      # The system CA bundle on Render. "system" doesn't work here: the psycopg
      # binary package ships its own OpenSSL, which looks for CAs elsewhere.
      - key: DATABASE_SSLROOTCERT
        value: /etc/ssl/certs/ca-certificates.crt
      - key: REDIS_URL
        sync: false
      - key: TRUSTED_PROXY_CIDRS
        value: 10.0.0.0/8
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: SESSION_MAX_HOURS
        value: "12"
      - key: PASSWORD_RESET_MINUTES
        value: "30"
      - key: EMAIL_VERIFICATION_MINUTES
        value: "30"
      - key: SMTP_HOST
        sync: false
      # Render's free plan blocks outbound SMTP on 25, 465 and 587. Port 2525
      # with STARTTLS (supported by Brevo) is still encrypted.
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_STARTTLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
