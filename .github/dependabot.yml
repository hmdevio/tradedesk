version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # pydantic pins an exact pydantic-core version, so they must move together.
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
    ignore:
      # Major upgrades are planned and tested by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
