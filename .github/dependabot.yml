version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # pydantic pins an exact pydantic-core version, so they must move together.
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
